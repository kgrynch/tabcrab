<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="w-[440px] h-[500px] bg-slate-50 font-sans text-slate-800">
    <div class="flex flex-col h-full">
        <!-- Header -->
        <header class="p-2 bg-white border-b border-slate-200 shadow-sm z-10">
            <!-- Row 1: Branding & Primary Actions -->
            <div class="flex items-center mb-2">
                <img src="icons/icon48.png" class="w-5 h-5 mr-2" alt="Tab Crab Icon">
                <h1 class="font-bold text-slate-800">Tab Crab</h1>
                <div class="flex-grow"></div>
                <button id="auto-group-btn" title="Automatically create tab groups by domain" class="action-btn-text">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 7.3c0-1.5-1.5-2.8-3-2.8s-3 1.3-3 2.8c0 1.5 1.5 2.8 3 2.8s3-1.3 3-2.8z"/><path d="M11.3 14.3c0-1.5-1.5-2.8-3-2.8s-3 1.3-3 2.8c0 1.5 1.5 2.8 3 2.8s3-1.3 3-2.8z"/><path d="M21 16.8c0-1.5-1.5-2.8-3-2.8s-3 1.3-3 2.8c0 1.5 1.5 2.8 3 2.8s3-1.3 3-2.8z"/><path d="M11.5 7.8c0-1.5-1.5-2.8-3-2.8s-3 1.3-3 2.8c0 1.5 1.5 2.8 3 2.8s3-1.3 3-2.8z"/><path d="M17.1 14.8c-1 .8-2.2 1.3-3.6 1.3-1.4 0-2.6-.5-3.6-1.3"/><path d="M12.4 8c-1 .8-2.2 1.3-3.6 1.3-1.4 0-2.6-.5-3.6-1.3"/></svg>
                    <span>Group</span>
                </button>
                <button id="dedupe-btn" title="Close duplicate tabs" class="action-btn-text">
                     <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 17H4a2 2 0 0 1-2-2V7c0-1.1.9-2 2-2h7"/><path d="M15 12v6"/><path d="M12 15h6"/><rect width="8" height="8" x="14" y="4" rx="2"/></svg>
                    <span>Dedupe</span>
                </button>
                <button id="sort-btn" title="Sort tabs in current window" class="action-btn-text">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6h6"/><path d="M2 12h10"/><path d="M2 18h14"/><path d="m20 12-4-4v8l4-4Z"/></svg>
                    <span>Sort</span>
                </button>
                <button id="consolidate-btn" title="Bring all tabs to this window" class="action-btn-text">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"/><path d="M10 21v-6a2 2 0 0 1 2-2h6"/><path d="M3 15v-6a2 2 0 0 1 2-2h6"/></svg>
                    <span>Gather</span>
                </button>
                <a href="options.html" target="_blank" title="Open Settings" class="action-btn ml-1">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 0 2l-.15.08a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l-.22-.38a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1 0-2l.15-.08a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                </a>
            </div>
            <!-- Row 2: Search & View Controls -->
            <div class="flex items-center space-x-2">
                <div class="relative flex-grow">
                    <input type="search" id="search-input" placeholder="Find a tab..." class="w-full pl-9 pr-4 py-1 text-sm bg-slate-100 border border-slate-200 rounded-lg focus:ring-2 focus:ring-cyan-400 focus:border-cyan-400 outline-none">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                </div>
                <button id="toggle-all-btn" title="Expand/Collapse All Groups" class="action-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="8" y1="12" x2="16" y2="12"></line></svg>
                </button>
                <div class="toggle-container">
                    <span class="toggle-label">Current</span>
                    <label class="toggle-switch-label">
                        <input type="checkbox" id="view-toggle" class="sr-only">
                        <div class="toggle-switch"></div>
                    </label>
                    <span class="toggle-label toggle-label-all">All</span>
                </div>
            </div>
        </header>
        
        <!-- Tab List -->
        <div class="flex-grow p-3 overflow-y-auto">
            <div id="native-groups-list" class="space-y-2 mb-3"></div>
            <div id="tab-list"></div>
            <div id="empty-state" class="hidden text-center text-slate-500 py-10">
                <p class="font-medium">The beach is clear!</p>
                <p class="text-sm">No open tabs found.</p>
            </div>
        </div>
    </div>
    <script src="popup.js"></script>
</body>
</html>
