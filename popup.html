<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            width: min(600px, 100vw);
            max-width: 100vw;
            box-sizing: border-box;
        }
    </style>
</head>
<body class="w-[440px] h-[500px] bg-slate-50 font-sans text-slate-800">
    <div class="flex flex-col h-full">
        <header class="p-2 bg-white border-b border-slate-200 shadow-sm z-10">
            <div class="flex items-center mb-2">
                <img src="icons/icon48.png" class="w-5 h-5 mr-2" alt="Tab Crab Icon">
                <h1 class="font-bold text-slate-800">Tab Crab</h1>
                <div class="flex-grow"></div>
                <button id="save-groups-btn" title="Save the current groups for later" class="action-btn-text hidden"><span>Save</span></button>
                <button id="smart-group-btn" title="Apply saved smart-group rules" class="action-btn-text hidden"><span>Apply Rules</span></button>
                <button id="auto-group-btn" title="Automatically create tab groups by domain" class="action-btn-text"><span>Group</span></button>
                <button id="dedupe-btn" title="Close duplicate tabs" class="action-btn-text"><span>Dedupe</span></button>
                <button id="sort-btn" title="Sort tabs in current window" class="action-btn-text"><span>Sort</span></button>
                <button id="consolidate-btn" title="Bring all tabs to this window" class="action-btn-text"><span>Gather</span></button>
                <a href="options.html" target="_blank" title="Open Settings" class="action-btn ml-1" aria-label="Open Settings">⚙</a>
            </div>
            <div class="flex items-center space-x-2">
                <div class="relative flex-grow">
                    <input type="search" id="search-input" placeholder="Find a tab..." class="w-full pl-9 pr-4 py-1 text-sm bg-slate-100 border border-slate-200 rounded-lg focus:ring-2 focus:ring-cyan-400 focus:border-cyan-400 outline-none">
                </div>
                <button id="toggle-all-btn" title="Expand/Collapse All Groups" class="action-btn" aria-label="Expand or collapse all groups">☰</button>
                <div class="toggle-container">
                    <span class="toggle-label">Current</span>
                    <label class="toggle-switch-label">
                        <input type="checkbox" id="view-toggle" class="sr-only">
                        <div class="toggle-switch"></div>
                    </label>
                    <span class="toggle-label toggle-label-all">All</span>
                </div>
            </div>
        </header>
        <div class="flex-grow p-3 overflow-y-auto main-scroll">
            <div id="native-groups-list" class="group-stack"></div>
            <div id="tab-list" class="group-stack"></div>
            <div id="saved-groups-list" class="group-stack hidden"></div>
            <div id="empty-state" class="hidden text-center text-slate-500 py-10">
                <p class="font-medium">The beach is clear!</p>
                <p class="text-sm">No open tabs found.</p>
            </div>
        </div>
    </div>
    <script src="popup.js"></script>
</body>
</html>
