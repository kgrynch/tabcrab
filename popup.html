<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="w-[440px] h-[500px] bg-slate-50 font-sans text-slate-800">
    <div class="flex flex-col h-full">
        <header class="p-2 bg-white border-b border-slate-200 shadow-sm z-10">
            <div class="flex items-center mb-2">
                <img src="icons/icon48.png" class="w-5 h-5 mr-2" alt="Tab Crab Icon">
                <h1 class="font-bold text-slate-800">Tab Crab</h1>
                <div class="flex-grow"></div>
                <button id="save-groups-btn" title="Save the current groups for later" class="action-btn-text hidden">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"/>
                        <path d="M17 21v-8H7v8"/>
                        <path d="M7 3v5h8"/>
                    </svg>
                    <span>Save</span>
                </button>
                <button id="smart-group-btn" title="Apply saved smart-group rules" class="action-btn-text hidden">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M3 12h18"/>
                        <path d="M12 3v18"/>
                        <circle cx="12" cy="12" r="8"/>
                    </svg>
                    <span>Apply Rules</span>
                </button>
                <button id="auto-group-btn" title="Automatically create tab groups by domain" class="action-btn-text">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <rect x="3" y="5" width="18" height="14" rx="2"/>
                        <path d="M3 10h18"/>
                    </svg>
                    <span>Group</span>
                </button>
                <button id="dedupe-btn" title="Close duplicate tabs" class="action-btn-text">
                     <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M7 7h10v10H7z"/>
                        <path d="M3 3v10h4"/>
                        <path d="M17 21v-4h4"/>
                    </svg>
                    <span>Dedupe</span>
                </button>
                <button id="sort-btn" title="Sort tabs in current window" class="action-btn-text">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M6 9l6-6 6 6"/>
                        <path d="M12 3v18"/>
                    </svg>
                    <span>Sort</span>
                </button>
                <button id="consolidate-btn" title="Bring all tabs to this window" class="action-btn-text">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M3 12h18"/>
                        <path d="M12 3l9 9-9 9-9-9 9-9z"/>
                    </svg>
                    <span>Gather</span>
                </button>
                <a href="options.html" target="_blank" title="Open Settings" class="action-btn ml-1">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="12" cy="12" r="3"/>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9.8 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09A1.65 1.65 0 0 0 15.2 4.6a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9c.39.14.66.5.66.99V10a2 2 0 0 1 0 4h-.09c-.49 0-.85.27-.99.66Z"/>
                    </svg>
                </a>
            </div>
            <div class="flex items-center space-x-2">
                <div class="relative flex-grow">
                    <input type="search" id="search-input" placeholder="Find a tab..." class="w-full pl-9 pr-4 py-1 text-sm bg-slate-100 border border-slate-200 rounded-lg focus:ring-2 focus:ring-cyan-400 focus:border-cyan-400 outline-none">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" aria-hidden="true">
                        <circle cx="11" cy="11" r="7"/>
                        <path d="M21 21l-4.35-4.35"/>
                    </svg>
                </div>
                <button id="toggle-all-btn" title="Expand/Collapse All Groups" class="action-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M4 6h16"/>
                        <path d="M4 12h16"/>
                        <path d="M4 18h16"/>
                    </svg>
                </button>
                <div class="toggle-container">
                    <span class="toggle-label">Current</span>
                    <label class="toggle-switch-label">
                        <input type="checkbox" id="view-toggle" class="sr-only">
                        <div class="toggle-switch"></div>
                    </label>
                    <span class="toggle-label toggle-label-all">All</span>
                </div>
            </div>
        </header>
        <div class="flex-grow p-3 overflow-y-auto main-scroll">
            <div id="native-groups-list" class="group-stack"></div>
            <div id="saved-groups-list" class="group-stack hidden"></div>
            <div id="tab-list" class="group-stack"></div>
            <div id="empty-state" class="hidden text-center text-slate-500 py-10">
                <p class="font-medium">The beach is clear!</p>
                <p class="text-sm">No open tabs found.</p>
            </div>
        </div>
    </div>
    <script src="popup.js"></script>
</body>
</html>
